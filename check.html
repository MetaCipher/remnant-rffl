<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>RFFL — sheet check</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/rffl-stats.css">
  <style>
    body { margin: 0; padding: 16px; background: #fff; }
    .rffl-checks { list-style: none; padding: 0; margin: 0; }
    .rffl-checks li { padding: 10px 12px; border: 1px solid var(--rffl-line); border-left: 4px solid var(--rffl-accent);
      border-radius: 8px; margin-bottom: 8px; }
    .rffl-checks b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--rffl-ink-soft); }
    .rffl-ok { border-left-color: #2e7d32 !important; }
  </style>
</head>
<body>
  <!-- Maintainer page: not linked from the widget. Open after each sheet update. -->
  <div class="rffl" id="check"><div class="rffl-loading"><div class="rffl-spin"></div>Checking the sheet…</div></div>

  <script src="config.js"></script>
  <script src="assets/rffl-compute.js"></script>
  <script src="assets/rffl-stats.js"></script>
  <script>
    (function () {
      var cfg = window.RFFL_CONFIG, el = document.getElementById('check'), esc = RFFLStats.esc;
      RFFLStats.load(cfg).then(function (d) {
        var found = RFFLCompute.checks(d, cfg);
        var html = '<header class="rffl-masthead"><div><h2 class="rffl-league">' + esc(cfg.leagueName) + ' sheet check</h2>' +
          '<div class="rffl-season">Things that don&#39;t add up — fix them in the Google Sheet</div></div></header>' +
          '<main class="rffl-body"><p>' + (found.length ? found.length + ' to look at. The public stats page still works; ' +
          'these just mean some numbers are probably mistyped or missing.' : '') + '</p><ul class="rffl-checks">';
        if (!found.length) html += '<li class="rffl-ok"><b>All clear</b>Every tab ties out.</li>';
        found.forEach(function (f) { html += '<li><b>' + esc(f.team) + '</b>' + esc(f.msg) + '</li>'; });
        el.innerHTML = html + '</ul></main>';
      }).catch(function (err) {
        el.innerHTML = '<div class="rffl-error"><strong>Couldn&#39;t load the sheet.</strong><br>' + esc(err.message || err) + '</div>';
      });
    })();
  </script>
</body>
</html>
